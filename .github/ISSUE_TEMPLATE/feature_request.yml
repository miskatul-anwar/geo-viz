name: Feature request
description: Suggest a capability for GeoViz
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / use case
      description: What are you trying to accomplish? Which workflows from QGIS/ArcGIS do you miss?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: checkboxes
    id: contribute
    attributes:
      label: Willingness to contribute
      options:
        - label: I am willing to help implement this feature
